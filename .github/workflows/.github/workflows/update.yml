name: Update Arabic + English IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and merge playlists
        run: |
          curl -L --fail --retry 3 \
            https://iptv-org.github.io/iptv/languages/ara.m3u \
            -o arabic.m3u

          curl -L --fail --retry 3 \
            https://iptv-org.github.io/iptv/languages/eng.m3u \
            -o english.m3u

          echo '#EXTM3U' > playlist.m3u
          tail -n +2 arabic.m3u >> playlist.m3u
          tail -n +2 english.m3u >> playlist.m3u

          rm arabic.m3u english.m3u

      - name: Save updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --cached --quiet || git commit -m "Update Arabic + English playlist"
          git push
